name: WASM core checks

on:
  push:
    paths:
      - "wasm-core/src/**"
      - "wasm-core/Cargo.toml"
      - "wasm-core/browser-worker.js"
      - "wasm-core/README.md"
      - ".github/workflows/wasm-core.yml"
  pull_request:
    paths:
      - "wasm-core/**"
      - ".github/workflows/wasm-core.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native-tests:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check browser worker JavaScript syntax
        run: node --input-type=module --check < wasm-core/browser-worker.js
      - name: Run portable core unit tests
        run: cargo test --manifest-path wasm-core/Cargo.toml

  wasm-build:
    name: WebAssembly compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Compile core for the browser
        run: cargo build --manifest-path wasm-core/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Package browser module and JavaScript bindings
        run: wasm-pack build wasm-core --target web --out-dir pkg --release
      - name: Commit generated browser package for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wasm-core/pkg/
          if ! git diff --cached --quiet; then
            git commit -m "Build browser WASM package"
            git push origin HEAD:main
          fi
      - name: Upload browser package
        uses: actions/upload-artifact@v4
        with:
          name: paradise-wasm-core-browser-package
          path: wasm-core/pkg/
          if-no-files-found: error
