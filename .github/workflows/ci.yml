name: Mod Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Browser JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check app scripts
        run: |
          node --check app.js
          node --check emulator.js
          node --check build.js
          node --input-type=module --check < wasm-core/browser-worker.js
          node --input-type=module --check < wasm-core/key-search-worker.js
          node --check playwright.config.js
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
      - name: Build distributable website
        run: npm run build
      - name: Upload website bundle
        uses: actions/upload-artifact@v4
        with:
          name: paradise-mod-studio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Verify generated WASM package exists
        run: |
          test -s wasm-core/pkg/paradise_wasm_core.js
          test -s wasm-core/pkg/paradise_wasm_core_bg.wasm
          grep -q 'WebAssembly' wasm-core/pkg/paradise_wasm_core.js

  rust:
    name: Rust tests and WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Run Rust unit tests
        run: cargo test --manifest-path wasm-core/Cargo.toml
      - name: Compile WebAssembly target
        run: cargo build --manifest-path wasm-core/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Verify generated package is reproducible
        run: wasm-pack build wasm-core --target web --out-dir pkg --release
