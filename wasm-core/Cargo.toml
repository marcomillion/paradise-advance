[package]
name = "paradise-wasm-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Portable browser-facing hardware components for the Paradise firmware emulator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
egui = { version = "0.29", features = ["serde"] }

[profile.release]
lto = true
opt-level = "s"

[package.metadata.wasm-pack.profile.release]
# Recent Rust/WASM output can use multiple tables, which the bundled wasm-opt MVP parser rejects.
wasm-opt = false
